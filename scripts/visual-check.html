<!doctype html><meta charset="utf-8"><title>慢慢岛 · 场景检查</title><style>body{margin:12px;background:#dbe2d4;font:14px system-ui;color:#40583f}.board{display:grid;grid-template-columns:repeat(2,600px);gap:18px}article{width:600px;height:424px;overflow:hidden;border-radius:12px;background:#f4f2e9}h2{margin:0;padding:9px 14px;font-size:14px;font-weight:500}iframe{width:1200px;height:1050px;border:0;transform:scale(.5);transform-origin:top left}a{display:block;padding:10px}</style><div style="padding:8px;position:sticky;top:0;z-index:999;background:#dbe2d4"><button onclick="exercise('pet')">全部摸摸头</button> <button onclick="exercise('toy')">全部玩道具</button> <button onclick="exercise('treat')">全部喂零食</button><output id="result"></output></div><div class="board" id="board"></div><script>
const files=['01-seaside','02-rainy-bookshop','03-forest-swing','04-hot-spring','05-moonlit-boat','06-snowy-fireplace','07-cloud-post','08-bamboo-tea','09-flower-garden','10-starry-camp','pelican_bicycle_relax_fixed'];const batch=new URLSearchParams(location.search).get('batch')||'1';const subset=batch==='1'?files.slice(0,6):files.slice(6);document.getElementById('board').innerHTML=subset.map(f=>`<article><h2>${f}</h2><iframe src="../${f}.html" title="${f}"></iframe></article>`).join('');
function exercise(mode){let total=0;document.querySelectorAll('iframe').forEach(f=>{const d=f.contentDocument;d.querySelector('[data-tool='+mode+']').click();d.querySelector('.companion-hit').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));total++;});document.getElementById('result').textContent=total+' 个场景 / '+mode;}
</script>
