    trans(rig.head,`rotate(${fmt(headTilt*.65)} 873 357)`);
    const jawOpen=feeding?Math.max(0,Math.sin(clamp(feedAge/1.5,0,1)*Math.PI))*12:0;
    trans(rig.jaw,`rotate(${fmt(jawOpen)} 928 301)`);
    const scarfSwing=state.reduced?0:Math.sin(t*2.4)*2.4+Math.sin(t*3.8)*.5;
    trans(rig.scarfTail,`rotate(${fmt(scarfSwing)} 860 355)`);
    trans(rig.tail,`rotate(${fmt(state.reduced?0:Math.sin(t*2.2)*1.3)} 710 425)`);
    rig.bikeShadow.setAttribute('rx',fmt(244+Math.sin(phase*2)*1.4));
    rig.boardPattern.setAttribute('patternTransform',`translate(${fmt(-travel%155)} 0)`);
    rig.sandPattern.setAttribute('patternTransform',`translate(${fmt(-travel%180)} 0)`);
    rig.wavePattern.setAttribute('patternTransform',`translate(${fmt(-t*9%240)} 0)`);
    trans(rig.dunes,`translate(${fmt(-state.rideT*30%1440)} 0)`);
    trans(rig.foreground,`translate(${fmt(-travel*1.06%1440)} 0)`);
    trans(rig.roadside,`translate(${fmt(1530-((state.rideT*90+192)%1740))} 0)`);
    const boatAge=state.uiT-state.boatStart;
    const rocking=boatAge<3&&!state.reduced?Math.sin(boatAge*5)*7*(1-boatAge/3):0;
    trans(rig.boat,`translate(${fmt((mobileQuery.matches?1105:1200)+Math.sin(t*.13)*23)} ${fmt(453+Math.sin(t*.9)*1.2)}) rotate(${fmt(Math.sin(t*.9)*1.4+rocking)})`);
    const bellAge=state.uiT-state.bellStart;
    trans(rig.bellRig,`rotate(${fmt(bellAge<1.1&&!state.reduced?Math.sin(bellAge*24)*6*(1-bellAge/1.1):0)} 960 436)`);
    trans(rig.distantBirds,`translate(${fmt(Math.sin(t*.12)*18)} ${fmt(Math.sin(t*.3)*6)})`);
    const flap=Math.sin(t*1.7)*3;
    path(rig.gullA,`M568 ${fmt(210+flap)}Q577 201 587 210Q596 201 606 ${fmt(210+flap)}`);
    path(rig.gullB,`M613 ${fmt(186-flap*.7)}Q620 180 627 186Q634 180 641 ${fmt(186-flap*.7)}`);
    clouds.forEach((cloud,index)=>{
      if(state.cloudDrag?.index!==index&&!state.reduced){const returnAmount=Math.exp(-dt*.42);cloud.ox*=returnAmount;cloud.oy*=returnAmount;}
      const drift=state.reduced?0:t*cloud.speed;
      const x=((cloud.baseX-drift+210)%1720+1720)%1720-210;
      trans(cloud.el,`translate(${fmt(x+cloud.ox)} ${fmt(cloud.baseY+cloud.oy)}) scale(${cloud.scale})`);
    });
    if(state.weather==='night')stars.forEach(s=>s.el.setAttribute('opacity',fmt(.35+Math.sin(t*.5+s.phase)*.22)));
    if(state.weather==='rain')rain.forEach(r=>{
      const y=(r.y+t*r.speed)%970-90;
      trans(r.el,`translate(${fmt(r.x-(y-r.y)*.06)} ${fmt(y)})`);
    });
  }

  function updatePlaybackUI(){
    $('pauseButton').setAttribute('aria-pressed',String(!state.running));
    $('pauseButton').setAttribute('aria-label',state.running?'暂停骑行':'继续骑行');
    $('pauseButton').title=state.running?'暂停骑行，不会暂停声音 · 空格':'继续慢慢骑 · 空格';
    $('pauseIcon').setAttribute('href',state.running?'#i-pause':'#i-play');
  }
  function togglePlayback(){state.running=!state.running;updatePlaybackUI();$('liveStatus').textContent=state.running?'团团继续慢慢骑。':'团团停下来歇一会儿，声音不会暂停。';}
  $('pauseButton').addEventListener('click',togglePlayback);
  $('speed').value=state.speed;$('speedValue').textContent=state.speed.toFixed(2)+'×';
  $('speed').addEventListener('input',event=>{
    state.speed=Number(event.target.value);rangeFill(event.target);
    $('speedValue').textContent=state.speed.toFixed(2)+'×';event.target.setAttribute('aria-valuetext',state.speed.toFixed(2)+' 倍速');savePrefs();
  });
  $('breathButton').addEventListener('click',()=>{
    state.breathing=!state.breathing;state.breathStart=state.uiT;
    document.body.classList.toggle('breathing',state.breathing);
    $('breathButton').setAttribute('aria-pressed',String(state.breathing));
    if(state.breathing)say('跟着海风，轻轻吸气，慢慢呼气。',3400);
  });
  function drawBreath(){
    if(!state.breathing)return;
    const p=(state.uiT-state.breathStart)%10;
    const inhale=p<4;
    const expansion=inhale ? .5-.5*Math.cos(Math.PI*p/4) : .5+.5*Math.cos(Math.PI*(p-4)/6);
    $('breathCore').style.transform=`scale(${state.reduced?1:(.72+expansion*.7).toFixed(3)})`;
    const label=inhale?'轻轻吸气':'慢慢呼气';
    if($('breathText').textContent!==label)$('breathText').textContent=label;
  }
  function immersive(enabled){
    state.immersive=enabled;document.body.classList.toggle('immersive',enabled);fitScene();
    if(enabled)$('exitImmersive').focus({preventScroll:true});else $('immersiveButton').focus({preventScroll:true});
  }
  $('immersiveButton').addEventListener('click',()=>immersive(true));
  $('exitImmersive').addEventListener('click',()=>immersive(false));

  // Wall-clock timeout; the AudioContext itself schedules the final fade, including
  // while the page is in the background. Browsers may still suspend background audio.
  function finishRest(){
    clearTimeout(timerHandle);state.deadline=0;state.sound=false;state.running=false;
    audio.mute();updateAudioUI();updatePlaybackUI();$('sleepTimer').value='0';
    $('timerCount').textContent='这一小段海风，先陪你到这里。';
    say('休息时间到了。团团陪你停一会儿。',6000);
  }
  $('sleepTimer').addEventListener('change',()=>{
    const minutes=Number($('sleepTimer').value);clearTimeout(timerHandle);
    state.deadline=minutes?Date.now()+minutes*60000:0;audio.setSleep(state.deadline);
    if(minutes){timerHandle=setTimeout(finishRest,minutes*60000);toast(`${minutes} 分钟后，声音会慢慢淡出，团团也会停下来。`);}
    else $('timerCount').textContent='暂停画面，也可以只听海。';
    updateTimer();
  });
  function updateTimer(){
    if(!state.deadline)return;
    const remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
    if(!remaining){finishRest();return;}
    const minutes=Math.floor(remaining/60),seconds=remaining%60;
    $('timerCount').textContent=`${minutes}:${String(seconds).padStart(2,'0')} 后慢慢收声${remaining<=20?' · 正在淡出':''}`;
  }
  setInterval(updateTimer,1000);
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.immersive){event.preventDefault();immersive(false);return;}
    if(event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;
    const target=event.target;
    if(target instanceof Element && target.closest('input,textarea,select,button,[contenteditable="true"],[role="button"]'))return;
    const actions={KeyM:toggleSound,KeyP:()=>pet(),KeyF:()=>feed(),KeyB:()=>spawnBubbles(5),KeyL:ringBell,Space:togglePlayback};
    const action=actions[event.code];if(action){event.preventDefault();action();}
  });
  function reducedChanged(event){
    state.reduced=event.matches;
    if(event.matches){state.running=false;updatePlaybackUI();}
  }
  if(motionQuery.addEventListener)motionQuery.addEventListener('change',reducedChanged);else motionQuery.addListener(reducedChanged);
  document.addEventListener('visibilitychange',()=>{
    state.lastFrame=null;if(document.hidden){stopBubbleHold();state.petting=false;state.cloudDrag=null;}
    else updateTimer();
  });
  window.addEventListener('pagehide',()=>{stopBubbleHold();if(audio.ctx)audio.ctx.suspend().catch(()=>{});});
  window.addEventListener('pageshow',event=>{if(event.persisted){state.sound=false;audio.mute();updateAudioUI();state.lastFrame=null;}});
  window.addEventListener('blur',()=>{stopBubbleHold();state.petting=false;state.cloudDrag=null;});

  // A deliberately gentle 30 fps visual clock. Audio runs independently.
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden)return;
    if(state.lastFrame===null){state.lastFrame=now;return;}
    if(now-state.lastFrame<1000/30)return;
    const dt=Math.min((now-state.lastFrame)/1000,.08);state.lastFrame=now;
    state.uiT+=dt;
    if(state.running){state.rideT+=dt*state.speed;if(!state.reduced)state.worldT+=dt;}
    drawScene(dt);advanceTweens();drawBubbles(dt);drawBreath();
  }
  updateMixer();setWeather(state.weather,false,false);updatePlaybackUI();updateAudioUI();
  document.querySelectorAll('input[type="range"]').forEach(rangeFill);
  drawScene(.033);requestAnimationFrame(frame);
  setTimeout(()=>say('你好呀，我是团团。摸摸我的头吧。',5200),900);
  setTimeout(()=>{if(!state.reduced&&state.running&&!document.hidden)spawnBubbles(3);},6200);
window.IslandCompanion={name:'团团',fullName:'鹈鹕团团',snack:'小鱼',point,pet:p=>pet(p,false),say,paused:()=>!state.running,sound:type=>type==='pop'?audio.pop():type==='nibble'?audio.drop():audio.bell(),effect:(kind,p,n=1)=>{if(kind==='bubble')spawnBubbles(n);}};
})();
</script>
